<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2D0B84" />
    <title>FamilyKit · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: #F0EEF3; color: #050011; font: 1rem/1.5 system-ui, sans-serif; }
      main { width: min(100%, 30rem); padding: clamp(1.25rem, 6vw, 2.5rem); border-radius: 1rem; background: #fff; }
      h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0; }
      a { display: inline-grid; min-height: 44px; place-items: center; padding: .5rem 1rem;
        border-radius: .5rem; background: #2D0B84; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>FamilyKit is offline</h1>
      <p>Reconnect to the internet to access your family profiles and documents.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>

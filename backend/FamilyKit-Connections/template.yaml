AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Dedicated FamilyKit founding enrollment and invitation API.
Parameters:
  UserPoolId:
    Type: String
  UserPoolClientId:
    Type: String
  ActivationTableName:
    Type: String
    Default: FamilyKitPinCredentials
  ProfilePicturesBucketName:
    Type: String
    Default: family-kit-profile-pictures
  MembersTableName:
    Type: String
    Default: FamilyKitFamilyMembers
  WebOrigin:
    Type: String
Resources:
  Connections:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  ConnectionsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref WebOrigin, "http://127.0.0.1:5173", "http://localhost:5173"]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 30
        ThrottlingRateLimit: 15
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPoolId}"
              audience: [!Ref UserPoolClientId]
  ConnectionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      Handler: lambda_function.lambda_handler
      CodeUri: .
      MemorySize: 128
      Timeout: 12
      Environment:
        Variables:
          TABLE_NAME: !Ref Connections
          ACTIVATION_TABLE: !Ref ActivationTableName
          PROFILE_PICTURES_BUCKET: !Ref ProfilePicturesBucketName
          MEMBERS_TABLE: !Ref MembersTableName
          USER_POOL_ID: !Ref UserPoolId
      Policies:
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:ListUsers, cognito-idp:AdminGetUser]
              Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt Connections.Arn
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt Connections.Arn
              Condition:
                "ForAllValues:StringEquals":
                  dynamodb:Attributes: [pk, firstUser, secondUser, supersededBy]
                Null:
                  dynamodb:Attributes: "false"
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ActivationTableName}"
              Condition:
                "ForAllValues:StringEquals":
                  dynamodb:Attributes: [userId, yourName, familyName, dateOfBirth, height, weight, bloodGroup, address, mobile, instagramUrl, facebookUrl, linkedinUrl]
                StringEqualsIfExists:
                  dynamodb:Select: SPECIFIC_ATTRIBUTES
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ActivationTableName}"
              Condition:
                "ForAllValues:StringEquals":
                  dynamodb:Attributes: [userId, yourName, dateOfBirth, height, weight, bloodGroup, address]
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MembersTableName}"
              Condition:
                "ForAllValues:StringEquals":
                  dynamodb:Attributes: [userId, memberId, name, dateOfBirth, height, weight, bloodGroup, address, profilePictureKey]
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MembersTableName}"
              Condition:
                "ForAllValues:StringEquals":
                  dynamodb:Attributes: [userId, memberId, email, relationship]
                Null:
                  dynamodb:Attributes: "false"
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${ProfilePicturesBucketName}/profile-pictures/*/PROFILE#SELF/*"
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConnectionsApi
            Path: /founding
            Method: GET
            Auth: { Authorizer: NONE }
        Preview:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConnectionsApi
            Path: /invitations/preview
            Method: POST
            Auth: { Authorizer: NONE }
        Enroll:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /founding/enroll, Method: POST }
        Family:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /family-connection, Method: GET }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /invitations, Method: POST }
        Share:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /invitations/shared, Method: POST }
        Cancel:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /invitations/cancel, Method: POST }
        Decline:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /invitations/decline, Method: POST }
        Review:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /invitations/review, Method: POST }
        ProfileSharing:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /family-connection/profile-sharing, Method: POST }
        LinkProfile:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /family-connection/link-profile, Method: POST }
        Accept:
          Type: HttpApi
          Properties: { ApiId: !Ref ConnectionsApi, Path: /invitations/accept, Method: POST }
Outputs:
  ConnectionsApiUrl:
    Value: !Sub "https://${ConnectionsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ConnectionsTable:
    Value: !Ref Connections
